<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#5b47e5" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Mitt skolschema</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icon.svg" />
    <link rel="stylesheet" href="styles.css?v=19" />
  </head>
  <body>
    <main class="app-shell">
      <section id="home" class="home-screen" aria-labelledby="welcome-title">
        <p class="eyebrow">SKOLDAGEN</p>
        <h1 id="welcome-title">Vems schema vill du se?</h1>
        <p class="intro">Välj ett namn för att se dagens lektioner eller hela veckan.</p>
        <div class="child-picker">
          <button class="child-card sixten" data-child="sixten"><span aria-hidden="true">S</span><strong>Sixten</strong><small>Mitt schema</small></button>
          <button class="child-card ilse" data-child="ilse"><span aria-hidden="true">I</span><strong>Ilse</strong><small>Mitt schema</small></button>
        </div>
        <button class="install-button hidden" id="install-app">Installera som app</button>
        <p class="install-help hidden" id="install-help"></p>
      </section>

      <section id="schedule" class="schedule-screen hidden" aria-live="polite">
        <header class="topbar">
          <button class="round-button" id="go-home" aria-label="Tillbaka till val av schema">←</button>
          <div><p class="eyebrow" id="child-label">SIXTENS SCHEMA</p><h1 id="schedule-title">Hej Sixten!</h1></div>
          <div class="topbar-actions"><button class="round-button" id="theme-toggle" aria-label="Växla mörkt läge">◐</button><button class="round-button" id="open-settings" aria-label="Inställningar">⚙</button></div>
        </header>

        <nav class="view-toggle" aria-label="Välj vy">
          <button data-view="day" class="active">Idag</button>
          <button data-view="week">Vecka</button>
        </nav>
        <section id="next-lesson" class="next-lesson" aria-live="polite"></section>
        <section id="schedule-content"></section>
      </section>
    </main>

    <dialog id="settings-dialog">
      <form method="dialog" class="settings-card">
        <button class="dialog-close" value="cancel" aria-label="Stäng">×</button>
        <p class="eyebrow">MINA INSTÄLLNINGAR</p>
        <h2>Gör schemat till ditt</h2>
        <p class="settings-subtitle">Inställningarna sparas bara på den här enheten.</p>
        <fieldset>
          <legend>Färgtema</legend>
          <div class="choice-row" id="accent-choices">
            <button type="button" data-accent="purple">Lila</button>
            <button type="button" data-accent="blue">Blå</button>
            <button type="button" data-accent="green">Grön</button>
            <button type="button" data-accent="coral">Korall</button>
          </div>
        </fieldset>
        <fieldset>
          <legend>Visa på lektionsrader</legend>
          <div class="choice-row" id="display-choices">
            <button type="button" data-display="both">Tid + ikon</button>
            <button type="button" data-display="times">Bara tid</button>
            <button type="button" data-display="icons">Bara ikon</button>
          </div>
        </fieldset>
      </form>
    </dialog>
    <script src="app.js?v=21"></script>
  </body>
</html>
